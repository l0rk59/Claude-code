# Builds the Android APK.
#
# - Started by hand (Actions > APK > Run workflow): builds it and attaches
#   it to the run, to download and try.
# - Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0):
#   builds it and publishes a release with it, which the app's update
#   check then offers. Only an APK signed with the release key is ever
#   published: without the key, the release step stops.
#
# The release key comes from the repository's secrets (see
# docs/publier.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      # The llama.cpp Vulkan shaders need a recent glslc; the NDK's and
      # Ubuntu's are too old. Only that program is taken from the SDK.
      - name: Shader compiler (glslc)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vulkan-sdk.tar.xz" \
            https://sdk.lunarg.com/sdk/download/1.4.363.1/linux/vulkan-sdk.tar.xz
          tar -xJf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP" \
            --wildcards '*/x86_64/bin/glslc'
          sudo install -m 755 "$(find "$RUNNER_TEMP" -path '*/x86_64/bin/glslc' | head -1)" /usr/local/bin/glslc
          glslc --version | head -1

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            # A test build: signed with a debug key, never published.
            echo "PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get

      - name: Build
        run: flutter build apk --release --target-platform android-arm64

      - name: Name the APK
        run: |
          version="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-test-debug-key"
          name="PrivateLM-${version}-arm64-v8a${suffix}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::error::No release key in the repository's secrets: an APK signed with a debug key is never published. See docs/publier.md."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [ "${tag#v}" != "$VERSION" ]; then
            echo "::error::The tag ($tag) and pubspec.yaml's version ($VERSION) differ: the update check compares them."
            exit 1
          fi
          gh release create "$tag" "$APK" --title "PrivateLM $VERSION" --generate-notes
